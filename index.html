
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>FamilyNest 2.0</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7f4;
      color: #403b46;
    }

    header {
      background: #f6c5c9;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin-bottom: 0;
    }

    main {
      max-width: 650px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px #0000000d;
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    input, select, button {
      font: inherit;
      border-radius: 10px;
      padding: 12px;
    }

    input, select {
      width: 100%;
      border: 1px solid #ddd;
      background: white;
      margin-bottom: 10px;
    }

    button {
      border: none;
      background: #b66a85;
      color: white;
      cursor: pointer;
    }

    .add {
      width: 100%;
      margin-bottom: 8px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .item span {
      flex: 1;
      overflow-wrap: anywhere;
    }

    .done {
      text-decoration: line-through;
      opacity: 0.5;
    }

    .delete {
      background: #e8a1a1;
      padding: 8px 12px;
    }

    .date-fields {
      display: grid;
      grid-template-columns: 1fr 1fr 1.4fr;
      gap: 8px;
    }

    .muted {
      color: #777;
      font-size: 13px;
    }

    .success {
      color: #26754b;
    }

    .error {
      color: #b3261e;
    }

    .backup-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .backup-buttons button {
      flex: 1;
    }

    #restoreFile {
      display: none;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #888;
    }
  </style>
</head>

<body>

  <header>
    <h1>🏡 FamilyNest</h1>
    <p>Váš rodinný pomocník ❤️</p>
  </header>

  <main>

    <section class="card">
      <h2>🌸 Rodinný přehled</h2>
      <p id="summary"></p>
      <p id="storageStatus"
         class="muted"
         role="status"></p>
    </section>

    <section class="card">
      <h2>🛒 Nákupní seznam</h2>

      <form id="shoppingForm">
        <input
          id="shoppingInput"
          placeholder="Co potřebujeme koupit?"
          maxlength="150"
          required
        >
        <button class="add" type="submit">
          Přidat nákup
        </button>
      </form>

      <div id="shoppingList"></div>
    </section>

    <section class="card">
      <h2>✅ Rodinné úkoly</h2>

      <form id="taskForm">
        <input
          id="taskInput"
          placeholder="Nový rodinný úkol"
          maxlength="150"
          required
        >
        <button class="add" type="submit">
          Přidat úkol
        </button>
      </form>

      <div id="taskList"></div>
    </section>

    <section class="card">
      <h2>📅 Rodinné události</h2>

      <form id="eventForm">
        <input
          id="eventInput"
          placeholder="Název události"
          maxlength="150"
          required
        >

        <div class="date-fields">
          <select id="day" aria-label="Den"></select>
          <select id="month" aria-label="Měsíc"></select>
          <select id="year" aria-label="Rok"></select>
        </div>

        <button class="add" type="submit">
          Přidat událost
        </button>
      </form>

      <div id="eventList"></div>
    </section>

    <section class="card">
      <h2>💾 Záloha rodinných údajů</h2>

      <p class="muted">
        Uložte si zálohu, abyste o své
        seznamy nepřišli při vymazání
        dat prohlížeče.
      </p>

      <div class="backup-buttons">
        <button id="backupButton" type="button">
          Stáhnout zálohu
        </button>

        <button id="restoreButton" type="button">
          Obnovit zálohu
        </button>
      </div>

      <input
        type="file"
        id="restoreFile"
        accept=".json,application/json"
      >
    </section>

  </main>

  <footer>
    FamilyNest 2.0 ❤️
  </footer>

  <script>
    "use strict";

    const STORAGE_KEY = "familynest_v2";

    const emptyData = () => ({
      shopping: [],
      tasks: [],
      events: []
    });

    let data = emptyData();
    let storageAvailable = false;

    const $ = id => document.getElementById(id);

    function showStatus(message, error = false) {
      const element = $("storageStatus");

      element.textContent = message;
      element.className = error
        ? "muted error"
        : "muted success";
    }

    function checkStorage() {
      try {
        const key = "familynest_storage_test";

        localStorage.setItem(key, "ok");

        if (localStorage.getItem(key) !== "ok") {
          return false;
        }

        localStorage.removeItem(key);
        return true;
      } catch (error) {
        return false;
      }
    }

    function validData(value) {
      return value &&
        typeof value === "object" &&
        Array.isArray(value.shopping) &&
        Array.isArray(value.tasks) &&
        Array.isArray(value.events);
    }

    function loadData() {
      if (!storageAvailable) {
        showStatus(
          "Ukládání v tomto prohlížeči není dostupné.",
          true
        );
        return;
      }

      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved !== null) {
          const parsed = JSON.parse(saved);

          if (!validData(parsed)) {
            throw new Error("Neplatná uložená data");
          }

          data = parsed;
        }

        showStatus("Ukládání je aktivní.");
      } catch (error) {
        showStatus(
          "Nepodařilo se načíst data. Použijte zálohu.",
          true
        );
      }
    }

    function saveData() {
      if (!storageAvailable) {
        showStatus(
          "Data se neukládají. Vytvořte si zálohu.",
          true
        );
        return false;
      }

      try {
        const serialized = JSON.stringify(data);

        localStorage.setItem(STORAGE_KEY, serialized);

        if (localStorage.getItem(STORAGE_KEY) !== serialized) {
          throw new Error("Kontrola zápisu selhala");
        }

        showStatus("Změny byly uloženy.");
        return true;
      } catch (error) {
        showStatus(
          "Uložení selhalo. Vytvořte si zálohu.",
          true
        );
        return false;
      }
    }

    function createButton(text, className, callback) {
      const button = document.createElement("button");

      button.type = "button";
      button.textContent = text;
      button.className = className;
      button.addEventListener("click", callback);

      return button;
    }

    function createItem(text, completed, toggle, remove) {
      const row = document.createElement("div");
      row.className = "item";

      if (toggle) {
        const checkbox = document.createElement("input");

        checkbox.type = "checkbox";
        checkbox.checked = completed;
        checkbox.style.width = "auto";
        checkbox.style.margin = "0";

        checkbox.addEventListener("change", toggle);
        row.appendChild(checkbox);
      }

      const label = document.createElement("span");
      label.textContent = text;

      if (completed) {
        label.className = "done";
      }

      row.appendChild(label);

      row.appendChild(
        createButton("✕", "delete", remove)
      );

      return row;
    }

    function renderList(containerId, items, type) {
      const container = $(containerId);
      container.replaceChildren();

      items.forEach((item, index) => {
        const toggle = type === "events"
          ? null
          : () => {
              item.done = !item.done;
              saveData();
              render();
            };

        const remove = () => {
          items.splice(index, 1);
          saveData();
          render();
        };

        const text = type === "events"
          ? formatDate(item.date) + " – " + item.text
          : item.text;

        container.appendChild(
          createItem(text, item.done, toggle, remove)
        );
      });

      if (items.length === 0) {
        const empty = document.createElement("p");
        empty.className = "muted";
        empty.textContent = "Zatím žádné položky.";
        container.appendChild(empty);
      }
    }

    function formatDate(value) {
      const parts = value.split("-");

      if (parts.length !== 3) {
        return value;
      }

      return (
        Number(parts[2]) + ". " +
        Number(parts[1]) + ". " +
        parts[0]
      );
    }

    function render() {
      renderList(
        "shoppingList",
        data.shopping,
        "shopping"
      );

      renderList(
        "taskList",
        data.tasks,
        "tasks"
      );

      data.events.sort((a, b) =>
        a.date.localeCompare(b.date)
      );

      renderList(
        "eventList",
        data.events,
        "events"
      );

      const shoppingCount = data.shopping.filter(
        item => !item.done
      ).length;

      const taskCount = data.tasks.filter(
        item => !item.done
      ).length;

      const today = new Date();
      const todayKey = [
        today.getFullYear(),
        String(today.getMonth() + 1).padStart(2, "0"),
        String(today.getDate()).padStart(2, "0")
      ].join("-");

      const upcomingCount = data.events.filter(
        item => item.date >= todayKey
      ).length;

      $("summary").textContent =
        "🛒 Nákupy: " + shoppingCount +
        " | ✅ Úkoly: " + taskCount +
        " | 📅 Nadcházející události: " +
        upcomingCount;
    }

    function addTextItem(formId, inputId, type) {
      $(formId).addEventListener("submit", event => {
        event.preventDefault();

        const input = $(inputId);
        const text = input.value.trim();

        if (!text) {
          return;
        }

        data[type].push({
          text: text,
          done: false
        });

        saveData();
        input.value = "";
        render();
      });
    }

    function fillSelect(id, start, end) {
      const select = $(id);

      for (let number = start; number <= end; number++) {
        const option = document.createElement("option");

        option.value = number;
        option.textContent = number;

        select.appendChild(option);
      }
    }

    function setupDates() {
      const now = new Date();

      fillSelect("day", 1, 31);
      fillSelect("month", 1, 12);
      fillSelect("year", now.getFullYear() - 5,
                 now.getFullYear() + 20);

      $("day").value = now.getDate();
      $("month").value = now.getMonth() + 1;
      $("year").value = now.getFullYear();
    }

    function addEvent() {
      $("eventForm").addEventListener("submit", event => {
        event.preventDefault();

        const text = $("eventInput").value.trim();

        const day = Number($("day").value);
        const month = Number($("month").value);
        const year = Number($("year").value);

        const date = new Date(year, month - 1, day);

        if (
          date.getFullYear() !== year ||
          date.getMonth() !== month - 1 ||
          date.getDate() !== day
        ) {
          alert("Zvolené datum není platné.");
          return;
        }

        if (!text) {
          return;
        }

        const dateKey = [
          year,
          String(month).padStart(2, "0"),
          String(day).padStart(2, "0")
        ].join("-");

        data.events.push({
          text: text,
          date: dateKey
        });

        saveData();
        $("eventInput").value = "";
        render();
      });
    }

    function downloadBackup() {
      const content = JSON.stringify(data, null, 2);
      const blob = new Blob([content], {
        type: "application/json"
      });

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = "familynest-zaloha.json";

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function restoreBackup(file) {
      if (!file) {
        return;
      }

      const reader = new FileReader();

      reader.onload = () => {
        try {
          const restored = JSON.parse(reader.result);

          if (!validData(restored)) {
            throw new Error("Neplatná záloha");
          }

          if (!confirm(
            "Nahradit současné údaje obsahem zálohy?"
          )) {
            return;
          }

          data = restored;
          saveData();
          render();

          alert("Záloha byla načtena.");
        } catch (error) {
          alert("Soubor zálohy není platný.");
        }
      };

      reader.readAsText(file);
    }

    function setupBackup() {
      $("backupButton").addEventListener(
        "click",
        downloadBackup
      );

      $("restoreButton").addEventListener(
        "click",
        () => $("restoreFile").click()
      );

      $("restoreFile").addEventListener(
        "change",
        event => {
          restoreBackup(event.target.files[0]);
          event.target.value = "";
        }
      );
    }

    function initialize() {
      storageAvailable = checkStorage();

      loadData();
      setupDates();
      setupBackup();

      addTextItem(
        "shoppingForm",
        "shoppingInput",
        "shopping"
      );

      addTextItem(
        "taskForm",
        "taskInput",
        "tasks"
      );

      addEvent();
      render();
    }

    initialize();
  </script>

</body>
</html>
